<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário da Empresa</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Formulário da Empresa</h1>
        <form id="formEmpresa">
            <label for="nomeEmpresa">1. Qual é o nome da sua empresa?</label>
            <input type="text" id="nomeEmpresa" required>

            <label for="servicos">2. Quais são os principais serviços que sua empresa oferece?</label>
            <textarea id="servicos" required></textarea>

            <label for="diferenciais">3. Quais são os diferenciais da sua empresa em relação à concorrência?</label>
            <textarea id="diferenciais" required></textarea>

            <label for="publicoAlvo">4. Quem é o seu público-alvo principal?</label>
            <textarea id="publicoAlvo" required></textarea>

            <label for="informacoesProcuradas">5. Que tipo de informações os clientes em potencial geralmente procuram
                em seu site ou perfil no Instagram?</label>
            <textarea id="informacoesProcuradas" required></textarea>

            <label for="objetivos">6. Quais são os objetivos principais que você deseja alcançar com a nova página web e
                perfil no Instagram?</label>
            <textarea id="objetivos" required></textarea>

            <label for="logotipo">7. Você já possui um logotipo e identidade visual definidos para sua empresa?</label>
            <textarea id="logotipo" required></textarea>

            <label for="valores">8. Quais são os valores e a mensagem que você deseja transmitir por meio da página web
                e do perfil no Instagram?</label>
            <textarea id="valores" required></textarea>

            <label for="referencia">9. Você possui algum site ou perfil no Instagram de referência que gostaria de
                compartilhar conosco?</label>
            <textarea id="referencia" required></textarea>

            <label for="funcionalidade">10. Há alguma funcionalidade específica que você gostaria de ter em sua página
                web?</label>
            <textarea id="funcionalidade" required></textarea>

            <label for="expectativas">11. Como você espera que sua página web e perfil no Instagram ajudem a atrair mais
                clientes e expandir seu negócio?</label>
            <textarea id="expectativas" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
